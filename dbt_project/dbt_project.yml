name: 'crypto_elt_pipeline'
version: '1.0.0'
config-version: 2

profile: 'crypto_elt_pipeline' # Ensure this matches your profiles.yml

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  crypto_elt_pipeline:
    # Everything in the staging folder goes to the 'staging' schema
    staging:
      +materialized: incremental
      +schema: staging
    # Everything in the marts folder goes to the 'mart' schema
    marts:
      +materialized: table
      +schema: mart