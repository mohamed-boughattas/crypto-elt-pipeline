name: 'crypto_elt_pipeline'
version: '1.0.0'
config-version: 2

profile: 'crypto_elt_pipeline'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  crypto_elt_pipeline:
    # Silver Layer: Cleaned and normalized data
    staging:
      +materialized: incremental
      +schema: staging
      +dagster_group: "Silver"
    # Gold Layer: Analytical business models
    marts:
      +materialized: table
      +schema: mart
      +dagster_group: "Gold"
