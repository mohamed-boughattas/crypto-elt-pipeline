version: 2

models:
  - name: fct_crypto_candlesticks
    description: |
      Gold layer: Daily OHLC candlestick data with moving averages for technical analysis.

      **Purpose**: Analytics-ready daily aggregations for trading analysis and dashboard reporting.
      **Business Value**: Provides standardized candlestick data for technical indicators and trend analysis.
      **Data Quality**: Comprehensive validation of financial metrics and business logic.

      **Technical Details**:
      - Materialized as TABLE (not incremental) because window functions
        (SMA calculations) require full historical context for correct values.
      - DuckDB efficiently handles full recomputation for this data volume.
      - Optimized for time-series analysis and dashboard queries.

      **Grain**: One row per (coin, trade_date) - daily candlestick
      **Time Zone**: UTC for consistent global analysis
      **Currency**: USD for standardized comparison

      **Financial Metrics**:
      - OHLC prices derived from hourly observations using financial best practices
      - Daily volume aggregated from hourly trading data
      - 7-day and 25-day simple moving averages for trend analysis
      - Intraday volatility percentage for risk assessment

      **Use Cases**:
      - Technical analysis and trading strategy development
      - Dashboard reporting and market monitoring
      - Historical trend analysis and backtesting
      - Risk management and volatility assessment

    tests:
      # Composite unique key test (coin + trade_date)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - coin
            - trade_date
      # Elementary data observability tests
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: trade_date
          config:
            tags: ["elementary"]
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: trade_date
          config:
            tags: ["elementary"]
            severity: warn
      - elementary.all_columns_anomalies:
          arguments:
            exclude_regexp: "^(coin|trade_date|samples_count)$"
          config:
            tags: ["elementary"]
            severity: warn
      # OHLC logical consistency tests - critical for financial data integrity
      - dbt_utils.expression_is_true:
          expression: "high_price >= low_price"
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: high_price
          column_B: open_price
          or_equal: true
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: high_price
          column_B: close_price
          or_equal: true
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: open_price
          column_B: low_price
          or_equal: true
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: close_price
          column_B: low_price
          or_equal: true

    columns:
      - name: coin
        description: |
          The cryptocurrency identifier (e.g., 'bitcoin', 'ethereum').
          Used for filtering and grouping analysis by specific cryptocurrencies.
          Critical for portfolio analysis and comparative performance.
        tests:
          - not_null

      - name: trade_date
        description: |
          The date of the candlestick (UTC).
          Primary time dimension for daily analysis and trend identification.
          Used for time-series queries and historical analysis.
        tests:
          - not_null

      - name: open_price
        description: |
          Price at the first recorded timestamp of the day (opening price).
          Financial metric representing the market opening level.
          Used in technical analysis for gap identification and trend analysis.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.00000001

      - name: close_price
        description: |
          Price at the last recorded timestamp of the day (closing price).
          Most important price for daily analysis and moving average calculations.
          Used for performance measurement and technical indicator calculations.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.00000001

      - name: high_price
        description: |
          Highest price recorded during the day.
          Key metric for resistance levels and price range analysis.
          Used in volatility calculations and technical analysis.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.00000001

      - name: low_price
        description: |
          Lowest price recorded during the day.
          Key metric for support levels and price range analysis.
          Used in volatility calculations and technical analysis.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.00000001

      - name: daily_volume
        description: |
          Total trading volume for the day (USD).
          Indicator of market activity, liquidity, and trading interest.
          Used for volume analysis and confirming price movements.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: volatility_pct
        description: |
          Intraday volatility percentage: ((High - Low) / Low) * 100.
          Risk metric indicating price movement intensity during the trading day.
          Used for risk assessment, position sizing, and volatility analysis.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: samples_count
        description: |
          Number of hourly price samples aggregated for the day.
          Data quality metric indicating data completeness and reliability.
          Should be 24 for complete daily data (hourly granularity).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1

      - name: sma_7
        description: |
          7-day simple moving average of close price.
          Short-term trend indicator for momentum analysis and trading signals.
          Used in crossover strategies and trend identification.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                where: "sma_7 is not null"

      - name: sma_25
        description: |
          25-day simple moving average of close price.
          Medium-term trend indicator for longer-term trend analysis.
          Used for identifying major trend direction and support/resistance levels.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                where: "sma_25 is not null"

      - name: bb_middle
        description: |
          Bollinger Band middle band (20-day simple moving average).
          Central reference line for Bollinger Bands indicator.
          Used as baseline for volatility analysis and trend identification.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                where: "bb_middle is not null"

      - name: bb_upper
        description: |
          Bollinger Band upper band (Middle + 2 standard deviations).
          Upper volatility boundary for price movements.
          Used to identify potential overbought conditions and resistance levels.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                where: "bb_upper is not null"

      - name: bb_lower
        description: |
          Bollinger Band lower band (Middle - 2 standard deviations).
          Lower volatility boundary for price movements.
          Used to identify potential oversold conditions and support levels.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                where: "bb_lower is not null"

      - name: bb_width
        description: |
          Bollinger Band width as percentage of middle band.
          Volatility indicator showing band expansion/contraction.
          Higher values indicate increased volatility, lower values indicate consolidation.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              config:
                where: "bb_width is not null"

      - name: bb_position
        description: |
          Price position relative to Bollinger Bands (0 to 1 scale).
          0 = at lower band, 1 = at upper band, 0.5 = at middle band.
          Can be negative when price breaks below lower band, or >1 when price breaks above upper band.
          Used to identify price extremes and potential reversal points.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -0.15
              max_value: 1.6
              config:
                where: "bb_position is not null"

      - name: daily_change_pct
        description: |
          Daily price change percentage: ((Close - Open) / Open) * 100.
          Performance metric indicating daily price movement direction and magnitude.
          Used for daily performance analysis and momentum indicators.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -100
              max_value: 100

      - name: price_range
        description: |
          Absolute price range: High price - Low price.
          Price volatility metric representing the total price movement during the trading day.
          Used for volatility analysis and trading range identification.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: rsi
        description: |
          14-day Relative Strength Index calculated using Wilder's smoothing method.
          Momentum oscillator measuring speed and magnitude of price changes.
          Values above 70 indicate overbought conditions, below 30 indicate oversold.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              config:
                where: "rsi is not null"

      - name: macd
        description: |
          MACD line: 12-day EMA minus 26-day EMA.
          Trend-following momentum indicator showing relationship between two moving averages.
          Positive values indicate bullish momentum, negative values indicate bearish momentum.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -1000
              max_value: 1000
              config:
                where: "macd is not null"

      - name: macd_signal
        description: |
          MACD Signal line: 9-day EMA of the MACD line.
          Used to generate buy/sell signals via MACD crossovers.
          When MACD crosses above signal line, it generates a bullish signal.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -1000
              max_value: 1000
              config:
                where: "macd_signal is not null"

      - name: macd_histogram
        description: |
          MACD Histogram: MACD line minus Signal line.
          Visual representation of the difference between MACD and its signal line.
          Positive (green) indicates bullish momentum, negative (red) indicates bearish momentum.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -1000
              max_value: 1000
              config:
                where: "macd_histogram is not null"
