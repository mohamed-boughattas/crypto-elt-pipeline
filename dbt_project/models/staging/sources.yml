version: 2

sources:
  - name: coingecko
    database: crypto
    schema: raw
    description: "Raw cryptocurrency market data from CoinGecko API"
    
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: timestamp

    tables:
      - name: bitcoin_prices
        description: "Historical price, market cap, and volume for Bitcoin"
        
        meta:
          dagster:
            asset_key: ["raw", "bitcoin_prices"]

        columns:
          - name: timestamp
            tests:
              - not_null
              - unique
          - name: price
            tests:
              - not_null