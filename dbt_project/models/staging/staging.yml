version: 2

sources:
  - name: coingecko
    database: crypto
    schema: raw
    description: |
      Raw cryptocurrency market data from CoinGecko API (flattened time-series).

      **Purpose**: Bronze layer - immutable landing zone for API data.
      **Source**: PyAirbyte extraction from CoinGecko API.
      **Frequency**: Incremental loading with hourly granularity.
      **Partitioning**: By cryptocurrency (10 major coins).

    freshness:
      warn_after: { count: 12, period: hour }
      error_after: { count: 24, period: hour }
    loaded_at_field: ingested_at

    tables:
      - name: crypto_prices
        description: |
          Flattened cryptocurrency market data from CoinGecko API.
          Each row represents a single timestamp with price, market_cap, and volume.

          **Business Context**: Raw market data used for financial analysis and trading decisions.
          **Data Quality**: Pre-flattened from nested API response, partitioned by coin.

        meta:
          dagster:
            asset_key: ["raw", "crypto_prices"]
          owner: "Data Engineering Team"
          business_owner: "Trading Analytics"

        columns:
          - name: coin
            description: |
              Cryptocurrency identifier (e.g., 'bitcoin', 'ethereum').
              Represents the base currency in the trading pair.
            tests:
              - not_null
              - accepted_values:
                  values: ['bitcoin', 'ethereum', 'ripple', 'solana', 'cardano', 'avalanche-2', 'polkadot', 'binancecoin', 'chainlink', 'dogecoin']

          - name: currency
            description: |
              Target currency for price conversion (e.g., 'usd').
              Represents the quote currency in the trading pair.
            tests:
              - not_null
              - accepted_values:
                  values: ["usd"]

          - name: ingested_at
            description: |
              Timestamp when data was ingested into Bronze layer.
              Used for data lineage tracking and incremental processing.
            tests:
              - not_null

          - name: recorded_at
            description: |
              Timestamp of the price observation (UTC).
              Hourly granularity for consistent time-series analysis.
            tests:
              - not_null

          - name: price
            description: |
              Price in the target currency.
              Represents the market price at the recorded timestamp.
            tests:
              - not_null

          - name: market_cap
            description: |
              Market capitalization in the target currency.
              Calculated as price * circulating supply.
            tests:
              - not_null

          - name: volume
            description: |
              Trading volume in the target currency.
              Represents 24h trading volume at the recorded timestamp.
            tests:
              - not_null

models:
  - name: stg_crypto_prices
    description: |
      Silver layer: Cleaned and deduplicated cryptocurrency price data.

      **Purpose**: Transform raw CoinGecko market data into a clean, typed,
      and deduplicated time-series format suitable for analytics.

      **Business Value**: Provides reliable, quality-assured price data for downstream analytics.
      **Data Quality**: Comprehensive validation and standardization.
      **Performance**: Optimized for time-series queries with proper clustering.

      **Grain**: One row per (coin, recorded_at) timestamp
      **Partitioning**: By cryptocurrency for efficient querying

      **Data Quality Rules**:
      - Prices are rounded to 8 decimal places for precision
      - Market cap and volume are rounded to 2 decimal places
      - Invalid records (null timestamps, non-positive prices) are filtered
      - Duplicate timestamps are deduplicated (latest ingested_at wins)
      - Currency is standardized to USD

    columns:
      - name: coin
        description: |
          Cryptocurrency identifier (e.g., 'bitcoin', 'ethereum').
          Used for filtering and grouping analysis by specific cryptocurrencies.
        tests:
          - not_null

      - name: currency
        description: |
          Target currency for price conversion (e.g., 'usd').
          Standardized to USD for consistent analysis across all cryptocurrencies.
        tests:
          - not_null
          - accepted_values:
              values: ["usd"]

      - name: ingested_at
        description: |
          Timestamp when data was ingested into the Bronze layer.
          Used for deduplication when duplicate (coin, recorded_at) pairs exist.
          Critical for data lineage and troubleshooting.
        tests:
          - not_null

      - name: recorded_at
        description: |
          Timestamp of the price observation (UTC, hourly granularity).
          Primary time dimension for time-series analysis and trend identification.
        tests:
          - not_null

      - name: price
        description: |
          Price in the target currency (8 decimal precision).
          Core metric for all cryptocurrency analysis and trading decisions.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.00000001

      - name: market_cap
        description: |
          Market capitalization in the target currency (2 decimal precision).
          Key metric for market size and cryptocurrency ranking.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: volume
        description: |
          Trading volume in the target currency (2 decimal precision).
          Indicator of market activity and liquidity.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
