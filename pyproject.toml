[project]
name = "crypto_elt_pipeline"
requires-python = ">=3.12,<3.15"
version = "0.1.0"
dependencies = [
    "airbyte>=0.38.0",
    "dagster==1.12.14",
    "dagster-dbt>=0.28.14",
    "dagster-duckdb-polars>=0.28.14",
    "dbt-duckdb>=1.10.0",
    "duckdb>=1.4.3",
    "fastapi>=0.104.0",
    "pandera[polars]>=0.29.0",
    "pendulum>=3.0.0",
    "plotly>=6.5.2",
    "polars>=1.38.1",
    "pyyaml>=6.0.0",
    "streamlit>=1.54.0",
    "uvicorn>=0.24.0",
    # Pin chardet to avoid RequestsDependencyWarning (sqlfluff installs chardet 6.x which exceeds requests' limit)
    "chardet>=3.0.2,<6.0.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "ruff>=0.15.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "pyright>=1.1.0",
    "pre-commit>=3.6.0",
    "types-PyYAML>=6.0.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore:.*Experimental.*",
    "ignore:DeprecationWarning",
    "ignore:The `field_name` argument on `with_info_after_validator_function` is deprecated",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "crypto_elt_pipeline"
registry_modules = ["crypto_elt_pipeline.components.*"]

# --- Linting & Formatting (ruff) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["crypto_elt_pipeline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Type Checking (pyright) ---
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "none"
