[project]
name = "crypto_elt_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "airbyte>=0.38.0",
    "dagster==1.12.14",
    "dagster-dbt>=0.28.14",
    "dagster-duckdb-polars>=0.28.14",
    "dbt-duckdb>=1.10.0",
    "pandas>=2.2.3",
    "polars>=1.38.1",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "crypto_elt_pipeline"
registry_modules = [
    "crypto_elt_pipeline.components.*",
]


